name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'
        os:
          - windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - name: Cache Julia Artifacts
        uses: julia-actions/cache@v2

      - name: Setup Julia Environment
        run: |
          julia -e 'using Pkg; isempty(Pkg.Registry.reachable_registries()) && Pkg.Registry.add("General")'
          Remove-Item -Path Manifest.toml -Force -ErrorAction SilentlyContinue
          julia --project=. -e 'using Pkg; Pkg.resolve(); Pkg.instantiate(); Pkg.precompile()'

      - name: Run Test Suite
        run: |
          julia --project=. test/runtests.jl

      - name: Run Environment Validation
        run: |
          julia --project=. scripts/validate_environment.jl
